[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-watermark-remover"
version = "6.0.0"
description = "High-speed 4K 60FPS Video Watermark Remover with AI Inpainting and Native C++ Hardware Acceleration"
readme = "README.md"
authors = [{ name = "Doctor9Trio" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "customtkinter>=6.0.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "simple-lama-inpainting>=0.1.0",
]

[project.scripts]
watermark-remover = "watermark_remover:main"
watermark-studio = "gui_app:main"
